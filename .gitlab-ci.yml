default:
  image: python:3.11

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SUPABASE_URL: "https://mock.supabase.co"
  SUPABASE_ANON_KEY: "mock-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key"

cache:
  paths:
    - .cache/pip

stages:
  - test

test_job:
  stage: test
  before_script:
    - python -V
    - pip install -r requirements.txt
  script:
    - pytest
