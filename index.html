<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrumptious — Log In</title>
  <link rel="stylesheet" href="static/css/style.css">
  <script>
    try {
      const theme = localStorage.getItem("scrumptious_theme") || "slate";
      const accent = localStorage.getItem("scrumptious_accent") || "indigo";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-accent", accent);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div style="display:flex; align-items:center; gap:0.65rem; margin-bottom:1.25rem;">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="scrumTopGrad" x1="4" y1="4" x2="24" y2="13" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#E0E7FF"/>
              </linearGradient>
              <linearGradient id="scrumBotGrad" x1="4" y1="15" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#67E8F9"/>
                <stop offset="100%" stop-color="#FFFFFF"/>
              </linearGradient>
            </defs>
            <!-- Top agile card fold -->
            <path d="M5 7C5 5.34315 6.34315 4 8 4H18C20.2091 4 22 5.79086 22 8C22 10.2091 20.2091 12 18 12H8C6.34315 12 5 10.6569 5 9V7Z" fill="url(#scrumTopGrad)"/>
            <!-- Bottom agile card fold -->
            <path d="M23 21C23 22.6569 21.6569 24 20 24H10C7.79086 24 6 22.2091 6 20C6 17.7909 7.79086 16 10 16H20C21.6569 16 23 17.3431 23 19V21Z" fill="url(#scrumBotGrad)"/>
            <!-- Agile Velocity Nodes -->
            <circle cx="18" cy="8" r="1.6" fill="#4F46E5"/>
            <circle cx="10" cy="20" r="1.6" fill="#0284C7"/>
          </svg>
        </div>
        <span class="brand-name">Scrumptious<span class="brand-dot">.</span></span>
      </div>

      <h1 id="formTitle">Welcome back</h1>
      <p class="subtitle" id="formSubtitle">Log in to collaborate on your sprint backlog.</p>

      <div class="form-error" id="formError"></div>

      <form id="authForm">
        <div class="field" id="nameField" style="display:none;">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" placeholder="Jamie Chen" autocomplete="name">
        </div>
        <div class="field" id="emailField">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
            <a href="reset-password.html" id="forgotLink" style="display:block; text-align:right; font-size:0.85rem; margin:-0.25rem 0 1rem;">Forgot password?</a>
        <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
      </form>

      <form id="mfaForm" style="display:none;">
        <div class="field">
          <label for="mfaCode">6-Digit Authenticator Code</label>
          <input type="text" id="mfaCode" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="letter-spacing:0.25rem; font-size:1.2rem; text-align:center;">
        </div>
        <button type="submit" class="btn-primary" id="mfaSubmitBtn">Verify Code</button>
        <button type="button" class="btn-secondary" id="mfaBackBtn" style="margin-top:0.6rem; width:100%;">Back to Login</button>
      </form>

      <p class="auth-switch">
        <span id="switchPrompt">New here?</span>
        <a href="#" id="switchLink">Create an account</a>
      </p>
    </div>
  </div>

  <script src="static/js/api.js"></script>
  <script src="static/js/toast.js"></script>
  <script src="static/js/auth.js"></script>
</body>
</html>
