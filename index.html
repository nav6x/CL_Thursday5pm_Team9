<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Corkboard</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <h1 id="formTitle">Welcome back</h1>
      <p class="subtitle" id="formSubtitle">Log in to see what your team's working on.</p>

      <div class="form-error" id="formError"></div>

      <form id="authForm">
        <div class="field" id="nameField" style="display:none;">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" placeholder="Jamie Chen">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
      </form>

      <p class="auth-switch">
        <span id="switchPrompt">New here?</span>
        <a href="#" id="switchLink">Create an account</a>
      </p>
    </div>
  </div>

  <script src="static/js/api.js"></script>
  <script src="static/js/toast.js"></script>
  <script src="static/js/auth.js"></script>
</body>
</html>
