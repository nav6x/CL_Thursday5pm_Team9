<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrumptious — Log In</title>
  <link rel="stylesheet" href="static/css/style.css">
  <script>
    try {
      const theme = localStorage.getItem("scrumptious_theme") || "slate";
      const accent = localStorage.getItem("scrumptious_accent") || "indigo";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-accent", accent);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div style="display:flex; align-items:center; gap:0.65rem; margin-bottom:1.25rem;">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M4 6h4v12H4V6zm6 4h4v8h-4v-8zm6 4h4v4h-4v-4z"/></svg>
        </div>
        <span class="brand-name">Scrumptious</span>
      </div>

      <h1 id="formTitle">Welcome back</h1>
      <p class="subtitle" id="formSubtitle">Log in to collaborate on your sprint backlog.</p>

      <div class="form-error" id="formError"></div>

      <form id="authForm">
        <div class="field" id="nameField" style="display:none;">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" placeholder="Jamie Chen">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
      </form>

      <p class="auth-switch">
        <span id="switchPrompt">New here?</span>
        <a href="#" id="switchLink">Create an account</a>
      </p>
    </div>
  </div>

  <script src="static/js/api.js"></script>
  <script src="static/js/toast.js"></script>
  <script src="static/js/auth.js"></script>
</body>
</html>
