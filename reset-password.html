<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrumptious — Reset Password</title>
  <link rel="stylesheet" href="static/css/style.css">
  <script>
    try {
      const theme = localStorage.getItem("scrumptious_theme") || "slate";
      const accent = localStorage.getItem("scrumptious_accent") || "indigo";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-accent", accent);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div style="display:flex; align-items:center; gap:0.65rem; margin-bottom:1.25rem;">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M4 6h4v12H4V6zm6 4h4v8h-4v-8zm6 4h4v4h-4v-4z"/></svg>
        </div>
        <span class="brand-name">Scrumptious</span>
      </div>

      <h1 id="formTitle">Reset your password</h1>
      <p class="subtitle" id="formSubtitle">Enter your email and we'll send you a link to choose a new password.</p>

      <div class="form-error" id="formError"></div>

      <!-- Step 1: request a reset link -->
      <form id="requestForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn-primary" id="requestBtn">Send reset link</button>
      </form>

      <!-- Step 2: choose a new password (shown when the emailed link is opened) -->
      <form id="resetForm" style="display:none;">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="resetBtn">Save new password</button>
      </form>

      <p class="auth-switch">
        <span>Remembered it?</span>
        <a href="index.html">Back to log in</a>
      </p>
    </div>
  </div>

  <script src="static/js/api.js"></script>
  <script src="static/js/toast.js"></script>
  <script src="static/js/reset.js"></script>
</body>
</html>
